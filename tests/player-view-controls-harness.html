<!doctype html><html lang="ko"><meta charset="utf-8"><title>하단 확대·채팅 메뉴 검사</title>
<style>
body{margin:0;background:#18231e;color:white;font:14px system-ui}section,#webplayer_contents{display:flex;width:100%;min-height:430px}main,#player_area{flex:1;min-width:0}#live_player_layout,#player{position:relative;width:100%;height:400px;background:#345}video{width:100%;height:100%}aside{width:340px;background:#222}.pzp-pc__bottom,.player_ctrlBox{position:absolute;bottom:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:flex-end;background:#0008}.pzp-pc:not(.pzp-pc--controls) .pzp-pc__bottom,.controls-hidden .player_ctrlBox{opacity:0;pointer-events:none}#result{white-space:pre-wrap;max-height:200px;overflow:auto}
</style><body data-result="pending"><div id="fixture"></div><pre id="result">pending</pre>
<script>
const soop=new URLSearchParams(location.search).has('soop'),messageListeners=[],storageListeners=[],errors=[];
window.addEventListener('error',event=>errors.push(event.message));
const store={features:{freeChat:true},[soop?'soopFreeChatLayout':'chzzkFreeChatLayout']:{width:250,height:220,xRatio:0,yRatio:0,enabled:true}};
window.chrome={runtime:{id:'test',sendMessage:async()=>({ok:true}),onMessage:{addListener:fn=>messageListeners.push(fn),removeListener:()=>{}}},storage:{local:{get:async()=>structuredClone(store),set:async values=>{for(const key of Object.keys(values)){store[key]=structuredClone(values[key]);storageListeners.forEach(fn=>fn({[key]:{newValue:values[key]}},'local'))}}},onChanged:{addListener:fn=>storageListeners.push(fn),removeListener:()=>{}}}};
const buttons='<span id="chzzk-player-tools">따라잡기</span><button class="custom__clip-button">클립</button>';
document.querySelector('#fixture').innerHTML=soop?`<div id="webplayer" class="chat_open"><div id="webplayer_contents"><div id="player_area"><div id="player"><video></video><div class="player_ctrlBox">${buttons}</div></div></div><aside class="wrapping side"><div class="chatting_box"><div id="chatting_area"><div id="chatbox">채팅</div><div id="actionbox"><div id="chat_write"><div id="write_area" contenteditable="true">작성 중</div></div></div></div></div></aside></div></div>`:`<section><main class="_is_large_test"><div id="live_player_layout" class="pzp pzp-pc pzp-pc--controls"><video></video><div class="pzp-pc__bottom">${buttons}</div></div></main><aside id="aside-chatting"><div><h2>채팅</h2><div role="log">채팅</div><div contenteditable="true">작성 중</div></div></aside></section>`;
if(soop)document.body.classList.add('screen_mode');
const wait=()=>new Promise(resolve=>setTimeout(resolve,90));
</script><script src="../player-view-controls.js"></script><script src="../media-zoom.js"></script><script src="../free-chat.js"></script><script>
(async()=>{
await wait();const results=[],check=(name,passed)=>results.push({name,passed:Boolean(passed)});
const player=document.querySelector(soop?'#webplayer':'#live_player_layout'),bottom=()=>player.querySelector(soop?'.player_ctrlBox':'.pzp-pc__bottom');
const zoom=()=>document.querySelector('#media-zoom-menu'),chat=()=>document.querySelector('#ctfc-toggle'),ui=()=>document.querySelector('#media-zoom-controls').shadowRoot;
check('확대와 채팅 겹치기가 같은 하단 메뉴에 위치',bottom().contains(zoom())&&bottom().contains(chat())&&zoom().parentElement===chat().parentElement);
check('따라잡기 바로 앞에 두 메뉴 배치',zoom().parentElement.nextElementSibling.id==='chzzk-player-tools');
check('우상단 확대 버튼 없음',ui().querySelector('#launcher').hidden);
check('메뉴가 표시될 때 두 버튼 표시',ChzzkViewControls.visible(zoom())&&ChzzkViewControls.visible(chat()));
zoom().click();await wait();check('확대 조절판은 하단 버튼 위에 열림',!ui().querySelector('#panel').hidden&&ui().querySelector('#panel').getBoundingClientRect().bottom<=zoom().getBoundingClientRect().top+2);
if(soop)player.classList.add('controls-hidden');else player.classList.remove('pzp-pc--controls');await wait();
check('기본 메뉴가 사라지면 두 메뉴와 열린 확대 패널도 숨김',!ChzzkViewControls.visible(zoom())&&!ChzzkViewControls.visible(chat())&&ui().querySelector('#panel').hidden);
if(soop)player.classList.remove('controls-hidden');else player.classList.add('pzp-pc--controls');await wait();
check('기본 메뉴 복귀 시 같은 버튼 복귀',ChzzkViewControls.visible(zoom())&&ChzzkViewControls.visible(chat()));
const previous=chat().getAttribute('aria-pressed');chat().click();await wait();check('하단 채팅 겹치기 버튼 동작',chat().getAttribute('aria-pressed')!==previous);
const fresh=bottom().cloneNode(false);fresh.innerHTML=buttons;bottom().replaceWith(fresh);await wait();
check('사이트 컨트롤 교체 후 중복 없이 재배치',fresh.contains(zoom())&&fresh.contains(chat())&&document.querySelectorAll('#media-zoom-menu').length===1&&document.querySelectorAll('#ctfc-toggle').length===1);
check('동작 후 실행 오류 없음',errors.length===0);
document.querySelector('#result').textContent=JSON.stringify({results,errors},null,2);document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
})().catch(error=>{document.querySelector('#result').textContent=error.stack;document.body.dataset.result='fail'});
</script>
