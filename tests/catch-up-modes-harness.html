<!doctype html><html lang="ko"><meta charset="utf-8"><title>따라잡기 방식 전환</title>
<body data-result="pending"><video class="webplayer-internal-video" style="width:640px;height:360px"></video><pre id="result">pending</pre>
<script>
history.replaceState(null,'','/live/'+'a'.repeat(32));
const results=[],check=(name,passed)=>results.push({name,passed});
let now=100000,current=50,edge=100,interval;
Object.defineProperty(performance,'now',{value:()=>now});
window.setInterval=fn=>{interval=fn;return 1};
const main=document.querySelector('video'),listeners=[],state={features:{catchUp:true,adSpeed:1}};
window.chrome={storage:{local:{get:async()=>state},onChanged:{addListener:fn=>listeners.push(fn)}}};
const range=()=>({length:1,start:()=>0,end:()=>edge});
Object.defineProperties(main,{currentTime:{get:()=>current,set:v=>current=v},seekable:{get:range},buffered:{get:range},paused:{get:()=>false},readyState:{get:()=>4},seeking:{get:()=>false}});
const emit=name=>main.dispatchEvent(new Event(name));
const step=ms=>{now+=ms;interval()};
const settings=value=>{state.features={...state.features,...value};listeners.forEach(fn=>fn({features:{newValue:state.features}},'local'))};
</script>
<script src="/tools-core.js"></script><script src="/ad-dom.js"></script><script src="/player-tools.js"></script>
<script>
(async()=>{
 await Promise.resolve();await Promise.resolve();
 check('안정 우선도 재생 가능하면 시작부터 1.5초 여유로 당김',current===98.5);
 step(3000);current=96;emit('progress');
 check('안정 우선도 수신 이벤트에서 밀린 위치를 즉시 당김',current===98.5);
 step(3000);emit('waiting');current=80;step(1000);
 check('실제 버퍼링 직후에는 무리하게 이동하지 않음',current===80&&main.playbackRate===1);
 now+=100;emit('canplay');
 check('안정 우선도 재생 가능하면 15초 대기 없이 당김',current===98.5);
 let bounded=true;
 for(let i=0;i<10;i++){now+=3000;emit('waiting');current=94;emit('canplay');bounded&&=current===98.5}
 check('반복 버퍼링 뒤에도 6초 밀린 영상을 1.5초 여유로 계속 당김',bounded);
 now+=100;current=95;emit('progress');
 check('이동 직후에는 이벤트로 이동 간격 제한을 우회하지 않음',current===95);
 step(3000);check('짧은 이동 보호 뒤에는 밀린 위치를 다시 당김',current===98.5);
 settings({catchUpMode:'lowLatency'});
 check('최소 지연으로 전환하면 이전 회복 대기와 여유를 해제',Math.abs(current-99.65)<.001);
 step(1000);current=98.8;emit('timeupdate');
 check('최소 지연의 이벤트 보정만 동작',main.playbackRate===1.15);
 settings({catchUpMode:'stable'});current=80;edge=110;now+=3000;emit('canplay');
 check('안정 우선으로 복귀해도 새 여유로 바로 당김',current===108.5);
 settings({catchUp:false,catchUpMode:'lowLatency'});current=50;edge=120;step(30000);emit('progress');
 check('꺼짐 상태에서 방식 전환해도 보정하지 않음',current===50&&main.playbackRate===1);
 settings({catchUp:true});check('다시 켜면 선택했던 최소 지연 하나만 적용',Math.abs(current-119.65)<.001);
 document.querySelector('#result').textContent=JSON.stringify(results,null,2);
 document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
})().catch(e=>{document.body.dataset.result='fail';document.querySelector('#result').textContent=JSON.stringify([{name:e.stack,passed:false}])});
</script></body></html>
