<!doctype html><html lang="ko"><meta charset="utf-8"><title>따라잡기 방식 전환</title>
<body data-result="pending"><video class="webplayer-internal-video" style="width:640px;height:360px"></video><pre id="result">pending</pre>
<script>
history.replaceState(null,'','/live/'+'a'.repeat(32));
const results=[],check=(name,passed)=>results.push({name,passed});
let now=100000,current=50,edge=100,interval,seeks=0;
Object.defineProperty(performance,'now',{value:()=>now});
window.setInterval=fn=>{interval=fn;return 1};
const main=document.querySelector('video'),listeners=[],state={features:{catchUp:true,adSpeed:1}};
window.chrome={storage:{local:{get:async()=>state},onChanged:{addListener:fn=>listeners.push(fn)}}};
const range=()=>({length:1,start:()=>0,end:()=>edge});
Object.defineProperties(main,{currentTime:{get:()=>current,set:v=>{current=v;seeks++}},seekable:{get:range},buffered:{get:range},paused:{get:()=>false},readyState:{get:()=>4},seeking:{get:()=>false}});
const emit=name=>main.dispatchEvent(new Event(name));
const step=ms=>{now+=ms;interval()};
const settings=value=>{state.features={...state.features,...value};listeners.forEach(fn=>fn({features:{newValue:state.features}},'local'))};
</script>
<script src="/tools-core.js"></script><script src="/ad-dom.js"></script><script src="/player-tools.js"></script>
<script>
(async()=>{
 await Promise.resolve();await Promise.resolve();
 check('시작부터 배속으로 따라잡고 자동으로 위치를 건너뛰지 않음',current===50&&main.playbackRate===1.15&&seeks===0);
 for(const mode of ['2','1.5','1']){
  current=80;settings({catchUpMode:mode});step(1000);emit('progress');
  const before=seeks;
  check(mode+'초 선택 시 배속 보정만 실행',current===80&&main.playbackRate===1.15);
  let smooth=true;
  for(let i=0;i<10;i++){now+=3000;emit('waiting');current=80;emit('canplay');smooth&&=current===80&&main.playbackRate===(i===0?1.15:1)&&seeks===before}
  check(mode+'초 반복 버퍼링에는 1배속으로 회복하고 자동 위치 이동 없음',smooth);
  step(600000);document.dispatchEvent(new CustomEvent('chzzk-tools:catch-up'));
  check(mode+'초는 오래 재생해도 수동 따라잡기 여유가 고정',current===100-Number(mode)&&seeks===before+1);
  step(1000);current=100-Number(mode)-.05;emit('timeupdate');
  check(mode+'초 목표 부근에서는 1배속',main.playbackRate===1);
 }
 settings({catchUp:false});current=50;const before=seeks;step(30000);emit('progress');
 check('꺼짐 상태에서는 배속과 위치 보정을 하지 않음',current===50&&main.playbackRate===1&&seeks===before);
 settings({catchUp:true});check('다시 켜면 선택했던 1초를 배속으로 따라잡음',current===50&&main.playbackRate===1.15&&seeks===before);
 document.querySelector('#result').textContent=JSON.stringify(results,null,2);
 document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
})().catch(e=>{document.body.dataset.result='fail';document.querySelector('#result').textContent=JSON.stringify([{name:e.stack,passed:false}])});
</script></body></html>
