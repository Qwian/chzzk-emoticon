<!doctype html><html lang="ko"><meta charset="utf-8"><title>생방송 광고와 본방송 공유 영역 검사</title>
<style>
.pzp{position:relative;width:800px;height:450px;background:#123}
.pzp-pc__video,.webplayer-internal-core-shadow,.webplayer-internal-core-source-container,.webplayer-internal-source-wrapper{position:absolute;inset:0;width:100%;height:100%}
video{position:absolute;inset:0;width:100%;height:100%;background:#246}
#midAdPlayerWrapper{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#midAdPlayerWrapper.mid_ad_mini{inset:12px 12px auto auto;width:26%;height:26%;transform:scale(.8)}
#midAdVideoContainer{position:absolute;inset:0;width:100%;height:100%;background:#543}
</style><body data-result="pending">
<div class="pzp"><div class="pzp-pc__video"><div class="webplayer-internal-core-shadow"><div class="webplayer-internal-core-source-container"><div class="webplayer-internal-source-wrapper"><video class="webplayer-internal-video"></video></div></div></div></div><div id="midAdPlayerWrapper" class="mid_ad_mini"><video id="midPlayer"></video><div id="midAdVideoContainer"><video id="ad"></video></div></div></div><pre id="result"></pre>
<script>
history.replaceState(null,'','/live/'+'a'.repeat(32));
const features={catchUp:false,adMute:true,adSpeed:1,adMini:true,mainAudio:true},listeners=[];
window.chrome={storage:{local:{get:async()=>({features})},onChanged:{addListener:fn=>listeners.push(fn)}}};
const main=document.querySelector('.webplayer-internal-video'),mid=document.querySelector('#midPlayer'),ad=document.querySelector('#ad'),wrapper=document.querySelector('#midAdPlayerWrapper'),container=document.querySelector('#midAdVideoContainer'),stage=document.querySelector('.pzp');
let mainPaused=false,midPaused=false,ended=false;
Object.defineProperties(main,{paused:{get:()=>mainPaused},readyState:{get:()=>4}});
Object.defineProperties(mid,{paused:{get:()=>midPaused},readyState:{get:()=>4}});
Object.defineProperties(ad,{paused:{get:()=>false},readyState:{get:()=>4},ended:{get:()=>ended},currentSrc:{get:()=> 'https://example.com/ad.mp4'}});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
</script><script src="/tools-core.js"></script><script src="/ad-dom.js"></script><script src="/player-tools.js"></script><script>
(async()=>{
 const results=[],check=(name,passed)=>results.push({name,passed:!!passed});
 const full=el=>{const a=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return ['x','y','width','height'].every(k=>Math.abs(a[k]-b[k])<1)};
 const mini=()=>{const a=container.getBoundingClientRect(),b=stage.getBoundingClientRect();return Math.abs(a.width-b.width*.26)<1&&Math.abs(a.right-(b.right-12))<1&&Math.abs(a.top-b.top-12)<1};
 await wait(1200);
 check('광고와 본방송을 함께 담는 바깥 영역은 전체 크기',full(wrapper));
 check('광고 영역 안의 별도 생방송 영상도 전체 크기',full(mid));
 check('광고 영상만 오른쪽 위 26% 크기',mini()&&Math.abs(ad.getBoundingClientRect().width-container.getBoundingClientRect().width)<1);
 check('광고만 음소거하고 생방송 음소거 유지',ad.muted&&!mid.muted&&!main.muted);
 mainPaused=true;await wait(1100);
 check('기존 본방송이 멈춰도 별도 생방송이 재생 중이면 큰 화면 유지',full(mid)&&mini());
 midPaused=true;await wait(1100);
 check('두 본방송 모두 멈추면 광고 축소 해제',!document.querySelector('.chzzk-tools-ad-mini,.chzzk-tools-main-full'));
 midPaused=false;mainPaused=false;await wait(1100);
 check('본방송 재개 시 배치 재적용',full(mid)&&mini());
 const set=value=>listeners.forEach(fn=>fn({features:{newValue:{...features,adMini:value}}},'local'));
 set(false);await wait(50);
 check('광고 축소 설정을 끄면 배치 복원',!document.querySelector('.chzzk-tools-ad-mini,.chzzk-tools-main-full'));
 set(true);await wait(50);
 check('설정을 다시 켜면 본방송 큰 화면 복구',full(mid)&&mini());
 ended=true;await wait(1100);
 check('광고 종료 시 크기와 음소거 복원',!document.querySelector('.chzzk-tools-ad-mini,.chzzk-tools-main-full')&&!ad.muted);
 ended=false;await wait(1100);history.replaceState(null,'','/live/'+'b'.repeat(32));wrapper.style.display='none';await wait(1100);
 check('채널 이동 후 이전 광고 배치 제거',!document.querySelector('.chzzk-tools-ad-mini,.chzzk-tools-main-full'));
 document.querySelector('#result').textContent=JSON.stringify(results,null,2);document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
})().catch(e=>{document.body.dataset.result='fail';document.querySelector('#result').textContent=e.stack});
</script></body></html>
