<!doctype html><html lang="ko"><meta charset="utf-8"><title>체크 상태와 실제 자동 배속 통합 검사</title>
<body data-ready="pending"><main><div class="pzp"><video id="main" class="webplayer-internal-video" style="width:640px;height:360px"></video><div><button class="custom__clip-button">클립 만들기</button></div></div></main>
<video id="other" style="width:120px;height:70px"></video><audio id="audio"></audio><pre id="result">pending</pre>
<script>
const params=new URLSearchParams(location.search),order=params.get('order')||'media-first',manual=Number(params.get('manual')||1);
history.replaceState(null,'','/live/'+'a'.repeat(32));
const livePath=location.pathname,storageListeners=new Set(),runtimeListeners=new Set();
const state={features:{catchUp:true,catchUpMode:'1.5',globalSpeed:true,favorites:false,followingExpanded:false,followingRefresh:false,channelLiveLink:false}};
window.chrome={runtime:{id:'test',onMessage:{addListener:fn=>runtimeListeners.add(fn),removeListener:fn=>runtimeListeners.delete(fn)},sendMessage:async message=>message.type==='MEDIA_FRAME_REPORT'?{rate:manual}:{ok:true}},storage:{local:{get:async()=>structuredClone(state),set:async values=>{const changes={};for(const[key,value]of Object.entries(values)){changes[key]={oldValue:state[key],newValue:value};state[key]=structuredClone(value)}storageListeners.forEach(fn=>fn(changes,'local'))}},onChanged:{addListener:fn=>storageListeners.add(fn),removeListener:fn=>storageListeners.delete(fn)}}};
let current=80,seeks=0,rateEvents=0;
const main=document.querySelector('#main'),range=()=>({length:1,start:()=>0,end:()=>100});
for(const video of document.querySelectorAll('video,audio'))Object.defineProperties(video,{paused:{get:()=>false},readyState:{get:()=>4}});
Object.defineProperties(main,{currentTime:{get:()=>current,set:value=>{current=value;seeks++}},seekable:{get:range},buffered:{get:range}});
main.addEventListener('ratechange',()=>rateEvents++);
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.catchUpRateProbe={
 snapshot(){const root=document.querySelector('#chzzk-player-tools')?.shadowRoot;return{rate:main.playbackRate,manual:main.dataset.chzzkToolsManualRate||'',owner:main.dataset.chzzkToolsCatchUp||'',checked:root?.querySelector('#catch-up')?.checked,status:root?.querySelector('#player-status')?.textContent||'',other:document.querySelector('#other').playbackRate,audio:document.querySelector('#audio').playbackRate,seeks,rateEvents}},
 async enabled(value){await chrome.storage.local.set({features:{...state.features,catchUp:value}})},
 apply(value){runtimeListeners.forEach(fn=>fn({type:'MEDIA_SPEED_APPLY',rate:value},null,()=>{}))},
 event(){main.dispatchEvent(new Event('timeupdate'))},
 setCurrent(value){current=value},
 nativeRate(value){main.playbackRate=value;main.dispatchEvent(new Event('ratechange'))},
 navigate(live){history.replaceState(null,'',live?livePath:'/video/123');document.dispatchEvent(new Event('chzzk-tools:ad-dom-change'))}
};
const load=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.body.append(script)});
</script><script src="/tools-core.js"></script><script src="/ad-dom.js"></script><script>
(async()=>{
 if(order==='media-first'){await load('/media-speed.js');await wait(80);await load('/player-tools.js')}
 else{await load('/player-tools.js');await wait(80);await load('/media-speed.js')}
 await load('/channel-tools.js');await wait(1200);document.body.dataset.ready='ready';
})().catch(error=>{document.body.dataset.ready='fail';document.querySelector('#result').textContent=error.stack});
</script></body></html>
