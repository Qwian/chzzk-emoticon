<!doctype html><html lang="ko"><meta charset="utf-8"><title>확장 연결 해제 회귀 검사</title>
<body data-result="pending"><h1>확장 연결 해제 · 로컬 검사</h1>
<video style="width:640px;height:360px"></video><pre id="result">pending</pre>
<script>
const params=new URLSearchParams(location.search),scenario=params.get('scenario')||'report',baseline=params.has('baseline');
const errors=[],rejections=[],runtimeListeners=new Set(),storageListeners=new Set();
let mode='ok',calls=0,frameCallback,frameCancelled=false;
window.addEventListener('error',e=>{errors.push(e.message);e.preventDefault()});
window.addEventListener('unhandledrejection',e=>{rejections.push(String(e.reason));e.preventDefault()});
const runtime={get id(){return mode==='missing-id'?undefined:'test';},onMessage:{addListener:fn=>runtimeListeners.add(fn),removeListener:fn=>runtimeListeners.delete(fn)},sendMessage:()=>{
 calls++;
 if(mode==='sync')throw Error('Extension context invalidated.');
 if(mode==='async')return Promise.reject(Error('Extension context invalidated.'));
 if(mode==='transient')return Promise.reject(Error('Could not establish connection. Receiving end does not exist.'));
 return Promise.resolve({rate:1.2});
}};
window.chrome={runtime,storage:{local:{get:async()=>({features:{globalSpeed:true}})},onChanged:{addListener:fn=>storageListeners.add(fn),removeListener:fn=>storageListeners.delete(fn)}}};
const video=document.querySelector('video');
Object.defineProperties(video,{paused:{get:()=>false},readyState:{get:()=>4}});
video.requestVideoFrameCallback=cb=>{frameCallback=cb;return 17};video.cancelVideoFrameCallback=id=>{frameCancelled=id===17};
const press=()=>{const e=new KeyboardEvent('keydown',{code:'Period',bubbles:true,cancelable:true});document.body.dispatchEvent(e);return e};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
</script><script>document.write('<script src="'+(baseline?'/artifacts/media-speed-0.5.1.js':'/media-speed.js')+'"><\/script>');</script><script>
(async()=>{
 const results=[],check=(name,passed)=>results.push({name,passed});
 await wait(60);check('초기 배속 통신 정상',video.playbackRate===1.2);
 mode=scenario==='async'?'async':scenario==='missing-id'?'missing-id':scenario==='transient'?'transient':'sync';
 if(scenario==='key')press();
 else await wait(4100);
 await wait(50);
 if(scenario==='transient'){
   check('일시 통신 실패로 연결을 영구 종료하지 않음',runtimeListeners.size===1);
   mode='ok';const count=calls;const event=press();await wait(40);
   check('일시 통신 실패 후 단축키 재사용',event.defaultPrevented&&calls>count);
 }else{
   check('동기 예외와 Promise 거부가 전역 오류로 새지 않음',errors.length===0&&rejections.length===0);
   const before=calls;await wait(4100);
   check('연결 해제 후 주기 통신 중단',calls===before);
   check('연결 해제 후 키를 가로채지 않음',!press().defaultPrevented);
   check('영상 배속 고정과 수동 표시 해제',!video.dataset.chzzkToolsManualRate);
   video.playbackRate=.8;await wait(20);check('이전 코드가 사용자 배속을 덮어쓰지 않음',video.playbackRate===.8);
   check('미디어와 확장 리스너·프레임 수집 정리',frameCancelled&&runtimeListeners.size===0&&storageListeners.size===0);
 }
 document.querySelector('#result').textContent=JSON.stringify({scenario,results,errors,rejections},null,2);
 document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
})().catch(e=>{document.querySelector('#result').textContent=e.stack;document.body.dataset.result='fail'});
</script></body></html>
