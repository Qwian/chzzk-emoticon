<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Dynamic shortcut harness</title>
    <style>
      #editor { width: 320px; min-height: 40px; }
    </style>
  </head>
  <body data-result="pending">
    <aside id="aside-chatting">
      <pre id="editor" contenteditable="true">기존</pre>
    </aside>
    <output id="result">pending</output>
    <script>
      const settings = {
        enabled: true,
        sendImmediately: false,
        diagnostics: true,
        shortcuts: [{
          id: "dynamic-q",
          code: "KeyQ",
          keyLabel: "Q",
          mapping: {
            type: "native",
            code: "{:dynamic_test:}",
            imageUrl: "https://ssl.pstatic.net/dynamic-test.png"
          }
        }]
      };
      window.chrome = {
        storage: {
          local: {
            get: async () => ({ settings }),
            set: async () => undefined
          },
          onChanged: { addListener: () => undefined }
        },
        runtime: { onMessage: { addListener: () => undefined } }
      };
    </script>
    <script src="../page-bridge.js"></script>
    <script src="../content.js"></script>
    <script>
      const editor = document.querySelector("#editor");
      const observedDebug = [];
      document.addEventListener("chzzk-caps-emote:debug", (event) => {
        observedDebug.push(event.detail);
      });
      let siteKeydownCount = 0;
      let siteCompositionInputCount = 0;
      let siteCompositionEventCount = 0;
      window.addEventListener("keydown", () => {
        siteKeydownCount += 1;
      }, true);
      document.addEventListener("input", (event) => {
        if (event.inputType === "insertCompositionText") {
          siteCompositionInputCount += 1;
        }
      });
      for (const type of ["compositionstart", "compositionupdate", "compositionend"]) {
        document.addEventListener(type, () => {
          siteCompositionEventCount += 1;
        });
      }

      function press(code, key, options = {}) {
        const event = new KeyboardEvent("keydown", {
          code,
          key,
          bubbles: true,
          cancelable: true,
          repeat: options.repeat || false,
          isComposing: options.isComposing || false
        });
        Object.defineProperty(event, "getModifierState", {
          value: (name) => name === "CapsLock"
        });
        window.dispatchEvent(event);
        return event;
      }

      function emitImeText() {
        editor.dispatchEvent(new CompositionEvent("compositionstart", {
          bubbles: true,
          cancelable: false,
          data: ""
        }));
        editor.dispatchEvent(new CompositionEvent("compositionupdate", {
          bubbles: true,
          cancelable: false,
          data: "ㅂ"
        }));
        const beforeInput = new InputEvent("beforeinput", {
          bubbles: true,
          cancelable: false,
          inputType: "insertCompositionText",
          data: "ㅂ",
          isComposing: true
        });
        editor.dispatchEvent(beforeInput);
        editor.append("ㅂ");
        const input = new InputEvent("input", {
          bubbles: true,
          cancelable: false,
          inputType: "insertCompositionText",
          data: "ㅂ",
          isComposing: true
        });
        editor.dispatchEvent(input);
        editor.dispatchEvent(new CompositionEvent("compositionend", {
          bubbles: true,
          cancelable: false,
          data: ""
        }));
        return { beforeInput, input };
      }

      function emitImeObjectReplacement() {
        const image = editor.querySelector("img:last-of-type");
        if (!image) return;
        const objectText = document.createTextNode("\uFFFC");
        image.replaceWith(objectText);
        editor.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          cancelable: false,
          inputType: "insertCompositionText",
          data: "\uFFFC",
          isComposing: true
        }));
      }

      function emitDeleteNoise() {
        for (const type of ["beforeinput", "input"]) {
          editor.dispatchEvent(new InputEvent(type, {
            bubbles: true,
            cancelable: type === "beforeinput",
            inputType: "deleteContentBackward",
            data: null
          }));
        }
      }

      window.setTimeout(() => {
        editor.focus();
        const unmapped = press("KeyW", "w");
        const first = press("KeyQ", "Process");
        const firstKeptFocus = document.activeElement === editor;
        emitImeText();

        window.setTimeout(() => {
          const repeated = press("KeyQ", "Process", { repeat: true });
          const repeatedKeptFocus = document.activeElement === editor;
          emitImeObjectReplacement();
          emitDeleteNoise();
          window.setTimeout(() => {
            const finalEditor = document.querySelector("#editor");
            const images = [...finalEditor.querySelectorAll("img")];
            const debugTypes = observedDebug.map(({ type }) => type);
            const passed =
              !unmapped.defaultPrevented &&
              first.defaultPrevented &&
              repeated.defaultPrevented &&
              firstKeptFocus &&
              repeatedKeptFocus &&
              siteKeydownCount === 1 &&
              siteCompositionInputCount === 0 &&
              siteCompositionEventCount === 0 &&
              images.length === 2 &&
              finalEditor.textContent === "기존" &&
              document.activeElement === finalEditor &&
              debugTypes.includes("keydown-blocked") &&
              debugTypes.includes("beforeinput-blocked") &&
              debugTypes.includes("ime-mutations-rolled-back") &&
              !debugTypes.includes("editor-suspended") &&
              !observedDebug.some(({ inputType }) => inputType === "deleteContentBackward") &&
              images.every((image) => image.alt === "{:dynamic_test:}");
            document.body.dataset.result = passed ? "pass" : "fail";
            document.querySelector("#result").textContent = passed ? "pass" : "fail";
          }, 20);
        }, 20);
      }, 20);
    </script>
  </body>
</html>
