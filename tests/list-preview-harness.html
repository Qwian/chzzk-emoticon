<!doctype html><html lang="ko"><meta charset="utf-8"><title>치지직·숲 우클릭 미리보기 검사</title>
<style>li{width:320px;height:180px;display:inline-block;position:relative;background:#283d31;margin:8px}a{display:block;width:100%;height:100%}video{width:100%;height:100%}</style>
<body data-result="pending"><h1>썸네일 우클릭 소리 미리보기</h1><ul>
<li id="chzzk" data-nlog-area="live_list.item" data-nlog-params='{"content_id":"123"}'><a href="https://chzzk.naver.com/live/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa">치지직 방송</a></li>
<li id="soop" data-broadcast-id="456"><div class="thumbs-box"><a href="https://play.sooplive.com/streamer/456">숲 방송</a></div></li>
<li id="old-soop" data-broadcast-id="789"><a href="https://play.sooplive.co.kr/streamer2/789">숲 이전 주소</a></li>
<li id="ordinary"><a href="https://example.org/">일반 링크</a></li></ul><pre id="result">pending</pre>
<script>
 const requests=[],instances=[],nativePlayers=[];
 window.chrome={storage:{local:{get:async()=>({features:{listPreview:true}})},onChanged:{addListener:()=>{}}}};
 HTMLMediaElement.prototype.play=function(){this.dispatchEvent(new Event('playing'));return Promise.resolve()};HTMLMediaElement.prototype.pause=function(){};HTMLMediaElement.prototype.load=function(){};HTMLMediaElement.prototype.canPlayType=()=>'';
 window.Hls=class{static isSupported(){return true}static Events={ERROR:'error'};constructor(){instances.push(this)}loadSource(url){this.url=url}attachMedia(video){video.dispatchEvent(new Event('playing'))}on(){}destroy(){this.closed=true}};
 window.fetch=async url=>{requests.push(url);return{ok:true,json:async()=>({content:{livePlaybackJson:JSON.stringify({media:[{mediaId:'HLS',path:'https://media.example.test/live.m3u8'}]})}})}};
 window.PreviewPlayer=class{constructor(config){this.config=config;nativePlayers.push(this)}addEventListener(){}async loadPreview(streamer,broadcast){this.streamer=streamer;this.broadcast=broadcast}async play(){document.getElementById(this.config.id)?.dispatchEvent(new Event('playing'))}async close(){this.closed=true}};
</script><script src="../preview-bridge.js"></script><script src="../list-preview.js"></script>
<script>
 (async()=>{
  const results=[],check=(name,passed)=>results.push({name,passed}),delay=()=>new Promise(r=>setTimeout(r,40));
  const right=(id,shiftKey=false)=>{const event=new MouseEvent('contextmenu',{bubbles:true,cancelable:true,shiftKey});document.querySelector('#'+id+' a').dispatchEvent(event);return event};
  await delay();check('일반 링크 우클릭은 가로채지 않음',!right('ordinary').defaultPrevented);
  check('Shift+우클릭은 원래 메뉴 유지',!right('chzzk',true).defaultPrevented);
  const event=right('chzzk');await delay();
  check('치지직은 클릭 이동 없이 공식 미리보기 요청',event.defaultPrevented&&requests[0].endsWith('/live/123/auto-play-info')&&location.pathname.endsWith('harness.html'));
  check('치지직 미리보기 영상만 소리 켜기',document.querySelector('#chzzk video')?.muted===false&&document.querySelector('#chzzk video')?.volume===.5);
  right('chzzk');await delay();check('다시 우클릭하면 영상과 연결 종료',!document.querySelector('#chzzk video')&&instances[0].closed);
  right('soop');await delay();
  check('숲 공식 플레이어로 음성 미리보기',nativePlayers[0]?.streamer==='streamer'&&nativePlayers[0]?.broadcast==='456'&&nativePlayers[0]?.muted===false);
  right('old-soop');await delay();check('숲 이전 도메인도 지원하고 이전 재생 종료',nativePlayers[0].closed&&nativePlayers[1]?.broadcast==='789');
  document.querySelector('#old-soop').dispatchEvent(new Event('pointerleave'));await delay();
  check('마우스를 빼면 소리와 재생 종료',nativePlayers[1].closed&&!document.querySelector('#old-soop video'));
  document.querySelector('#result').textContent=JSON.stringify(results,null,2);document.body.dataset.result=results.every(r=>r.passed)?'pass':'fail';
 })().catch(error=>{document.body.dataset.result='fail';document.querySelector('#result').textContent=error.stack;});
</script></body></html>
