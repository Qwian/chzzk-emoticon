<!doctype html><html lang="ko"><meta charset="utf-8"><title>F 극장모드와 숲 정지/재생 검사</title>
<style>video{width:640px;height:360px}</style><body data-result="pending">
<div id="player"><video></video><div id="controls" tabindex="0">
<button id="time_shift_play" class="pause">일시정지</button><button id="play" class="stop">정지</button>
<button id="theater">극장모드</button><button id="wrong">다른 플랫폼 버튼</button><button class="btn_fullScreen_mode">전체화면</button>
</div></div><input id="search"><div id="chat" contenteditable="true">작성 중</div><button id="outside">일반 버튼</button><pre id="result"></pre>
<script>
const soop=new URLSearchParams(location.search).has('soop'),listeners=new Set();
window.chrome={runtime:{id:'fixture'},storage:{local:{get:async()=>({features:{playerShortcuts:true}})},onChanged:{addListener:fn=>listeners.add(fn),removeListener:fn=>listeners.delete(fn)}}};
const player=document.querySelector('#player'),video=document.querySelector('video'),controls=document.querySelector('#controls'),play=document.querySelector('#play'),theater=document.querySelector('#theater'),wrong=document.querySelector('#wrong');
let paused=false,theaterClicks=0,wrongClicks=0,fullClicks=0,playClicks=0,purchases=0,timeShiftClicks=0,timeShiftAllowed=false,timeShiftDelay=0;
if(soop){player.id='webplayer';theater.className='btn_screen_mode';wrong.className='pzp-viewmode-button'}else{player.className='pzp';play.className='pzp-pc__playback-switch';theater.className='pzp-pc__viewmode-button';wrong.className='btn_screen_mode'}
Object.defineProperties(video,{readyState:{get:()=>4},paused:{get:()=>paused}});
theater.onclick=()=>{theaterClicks++;document.body.classList.toggle(soop?'screen_mode':'fixture-wide')};wrong.onclick=()=>wrongClicks++;
document.querySelector('.btn_fullScreen_mode').onclick=()=>fullClicks++;
document.querySelector('#time_shift_play').onclick=()=>{timeShiftClicks++;if(!timeShiftAllowed){purchases++;return}const button=document.querySelector('#time_shift_play');button.classList.toggle('play');button.classList.toggle('pause');if(timeShiftDelay)setTimeout(()=>paused=!paused,timeShiftDelay);else paused=!paused};
play.onclick=()=>{playClicks++;if(!soop){paused=!paused;return}if(play.classList.contains('stop')){paused=true;play.className='play';video.remove()}else{paused=false;play.className='stop';player.prepend(video)}};
const wait=(ms=30)=>new Promise(resolve=>setTimeout(resolve,ms));
const fire=(type,code,target=controls,extra={})=>{const event=new KeyboardEvent(type,{code,key:code==='Space'?' ':code==='KeyF'?'f':code,bubbles:true,cancelable:true,composed:true,...extra});target.dispatchEvent(event);return event};
const press=async(code,target=controls,extra={})=>{fire('keydown',code,target,extra);fire('keyup',code,target,extra);await wait(soop&&code==='Space'?180:30)};
</script><script src="/player-shortcuts.js"></script><script>
for(const type of ['keydown','keyup'])window.addEventListener(type,event=>{
 if(event.target.closest?.('input,[contenteditable="true"]')||event.ctrlKey||event.shiftKey||event.altKey||event.metaKey||event.isComposing)return;
 if(event.code==='KeyF'&&type===(soop?'keyup':'keydown'))fullClicks++;
 if(soop&&event.code==='Space'&&type==='keyup'&&timeShiftAllowed&&video.isConnected)document.querySelector('#time_shift_play').click();
});
(async()=>{
 const results=[],check=(name,passed)=>results.push({name,passed:!!passed});await wait();
 await press('KeyF');check('F는 플랫폼의 기본 극장 버튼만 실행',theaterClicks===1&&wrongClicks===0&&fullClicks===0);
 await press('KeyF');check('F를 다시 누르면 원래 화면으로 복귀',theaterClicks===2&&!document.body.classList.contains(soop?'screen_mode':'fixture-wide'));
 fire('keydown','KeyF');fire('keydown','KeyF',controls,{repeat:true});fire('keyup','KeyF');await wait();check('길게 눌러도 한 번 전환하고 native F keyup 차단',theaterClicks===3&&fullClicks===0);
 await press('KeyF',controls,{key:'Process'});check('한글 IME도 물리 F 코드 사용',theaterClicks===4);
 await press('KeyF',play);check('플레이어 버튼에 포커스가 있어도 F 동작',theaterClicks===5&&fullClicks===0);
 const before=theaterClicks;
 for(const target of [document.querySelector('#search'),document.querySelector('#chat'),document.querySelector('#outside')])await press('KeyF',target);
 await press('KeyF',controls,{ctrlKey:true});await press('KeyF',controls,{shiftKey:true});await press('KeyF',controls,{isComposing:true});
 const host=document.createElement('div');host.attachShadow({mode:'open'}).innerHTML='<input>';document.body.append(host);await press('KeyF',host.shadowRoot.firstChild);
 check('입력창·채팅·외부 버튼·조합키·IME 조합·shadow 입력 제외',theaterClicks===before);
 const modal=document.createElement('dialog');modal.textContent='모형';document.body.append(modal);modal.showModal();await press('KeyF');check('실제 모달에서는 극장 버튼 조작 안 함',theaterClicks===before);modal.close();modal.remove();
 theater.disabled=true;await press('KeyF');check('비활성 극장 버튼 제외',theaterClicks===before);theater.disabled=false;
 if(soop){
  await press('Space');check('타임머신 권한 없으면 기본 정지 버튼 사용',paused&&!video.isConnected&&play.classList.contains('play')&&playClicks===1&&timeShiftClicks===0&&purchases===0);
  await press('KeyF');check('정지로 영상이 사라져도 F 극장 전환 가능',theaterClicks===before+1);
  await press('Space');check('정지 뒤 스페이스로 기본 재생 복구',!paused&&video.isConnected&&play.classList.contains('stop')&&playClicks===2&&purchases===0);
  timeShiftAllowed=true;await press('Space');check('정상 타임머신 일시정지는 네이티브 처리 유지',paused&&video.isConnected&&playClicks===2&&timeShiftClicks===1);
  await press('Space');check('정상 타임머신 재생과 중복 정지 없음',!paused&&playClicks===2&&timeShiftClicks===2);
  timeShiftDelay=250;await press('Space');check('타임머신 전환이 늦어도 네이티브 버튼 상태가 바뀌면 정지로 덮어쓰지 않음',!paused&&playClicks===2&&timeShiftClicks===3);await wait(120);timeShiftDelay=0;await press('Space');check('지연된 일시정지 뒤에도 네이티브 재생 유지',!paused&&playClicks===2&&timeShiftClicks===4);
  timeShiftAllowed=false;play.disabled=true;await press('Space');check('정지 버튼 비활성이면 구매 버튼을 대신 누르지 않음',!paused&&playClicks===2&&purchases===0);play.disabled=false;
 }
 const nativeBeforeRelease=fullClicks;fire('keydown','KeyF');const heldTheater=theaterClicks;window.dispatchEvent(new Event('blur'));fire('keyup','KeyF');await wait();check('F 처리 뒤 blur와 늦은 keyup에서도 전체화면으로 바뀌지 않음',theaterClicks===heldTheater&&fullClicks===nativeBeforeRelease);
 fire('keydown','KeyF');const final=theaterClicks;const nativeAtDisable=fullClicks;listeners.forEach(fn=>fn({features:{newValue:{playerShortcuts:false}}},'local'));fire('keyup','KeyF');await wait();check('F 처리 중 설정을 꺼도 대응 keyup 중복 차단',theaterClicks===final&&fullClicks===nativeAtDisable);
 await press('KeyF');check('기능을 끄면 새 F 전환 해제',theaterClicks===final);
 document.querySelector('#result').textContent=JSON.stringify({platform:soop?'SOOP':'CHZZK',results},null,2);document.body.dataset.result=results.every(row=>row.passed)?'pass':'fail';
})().catch(error=>{document.body.dataset.result='fail';document.querySelector('#result').textContent=error.stack});
</script></body></html>
