<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치지직 이모티콘 설정</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CHZZK QUICK EMOTE</p>
          <h1>Caps Lock 이모티콘</h1>
        </div>
        <label class="switch" title="확장 프로그램 켜기/끄기">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <p class="intro">
        왼쪽 키 버튼을 눌러 단축키를 지정하세요. 채팅창에 커서를 둔 뒤
        Caps Lock과 함께 사용합니다.
      </p>

      <section id="mapping-list" aria-label="키 매핑"></section>

      <button id="add-shortcut" type="button">+ 키 추가</button>

      <label class="send-option">
        <input id="send-immediately" type="checkbox" />
        <span>입력 후 바로 전송</span>
      </label>

      <p id="status" role="status" aria-live="polite"></p>

      <details class="diagnostics">
        <summary>입력 진단</summary>
        <label class="send-option">
          <input id="diagnostics-enabled" type="checkbox" />
          <span>이벤트 기록 켜기</span>
        </label>
        <textarea id="diagnostic-log" readonly placeholder="진단을 켜고 문제를 재현하세요."></textarea>
        <div class="diagnostic-actions">
          <button id="refresh-diagnostics" type="button">로그 새로고침</button>
          <button id="clear-diagnostics" type="button">로그 지우기</button>
        </div>
      </details>
      <p class="footnote">
        키를 더 만들 수 있으며 목록이 길어지면 이 영역 안에서 스크롤됩니다.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
