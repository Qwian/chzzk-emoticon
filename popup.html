<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치지직 편의 도구 설정</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CHZZK TOOLS</p>
          <h1>치지직 편의 도구</h1>
        </div>
        <label class="switch" title="Caps Lock 단축키 켜기/끄기">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section id="video-zoom" aria-label="방송 영상 확대·이동">
        <strong>방송 영상 확대·이동</strong>
        <div class="zoom-row">
          <button type="button" data-action="decrease" aria-label="영상 축소">−</button>
          <output aria-live="polite">100%</output>
          <button type="button" data-action="increase" aria-label="영상 확대">＋</button>
          <button type="button" data-action="reset">원래대로</button>
        </div>
        <input type="range" min="100" max="500" step="5" value="100" aria-label="영상 확대 배율">
        <div class="zoom-row">
          <button type="button" data-action="pan" data-x="-0.2" aria-label="영상 왼쪽 보기">←</button>
          <button type="button" data-action="pan" data-y="-0.2" aria-label="영상 위쪽 보기">↑</button>
          <button type="button" data-action="pan" data-y="0.2" aria-label="영상 아래쪽 보기">↓</button>
          <button type="button" data-action="pan" data-x="0.2" aria-label="영상 오른쪽 보기">→</button>
          <button type="button" data-action="open">화면 조절판</button>
        </div>
        <p role="status" class="footnote">방송 영상에 연결 중…</p>
        <p class="footnote">Alt+휠: 확대 · Alt+드래그/방향키: 이동 · Alt+0: 초기화 · Alt+Z: 조절판</p>
      </section>

      <p class="intro">
        왼쪽 키 버튼을 눌러 단축키를 지정하세요. 채팅창에 커서를 둔 뒤
        Caps Lock과 함께 사용합니다.
      </p>

      <section id="mapping-list" aria-label="키 매핑"></section>

      <button id="add-shortcut" type="button">+ 키 추가</button>

      <p id="status" role="status" aria-live="polite"></p>

      <details id="diagnostics-panel" class="diagnostics">
        <summary>입력 진단</summary>
        <label class="send-option">
          <input id="diagnostics-enabled" type="checkbox" />
          <span>이벤트 기록 켜기</span>
        </label>
        <textarea id="diagnostic-log" readonly placeholder="진단을 켜고 문제를 재현하세요."></textarea>
        <div class="diagnostic-actions">
          <button id="refresh-diagnostics" type="button">로그 새로고침</button>
          <button id="clear-diagnostics" type="button">로그 지우기</button>
        </div>
      </details>
      <p class="footnote">
        키를 더 만들 수 있으며 목록이 길어지면 이 영역 안에서 스크롤됩니다.
      </p>
    </main>

    <script src="tools-core.js"></script>
    <script src="popup.js"></script>
    <script src="popup-zoom.js"></script>
  </body>
</html>
